name: prod-java-on-eks
on: 
  push: 
    branches: [main]
permissions:
  id-token: write
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v7
        with:
          repository: 'BhupeshDahiya/Demo_Java_App'

      - name: Setup java and build
        uses: actions/setup-java@v5
        with:
          cache: 'maven'
          distribution: temurin
          java-version: '21'
      - run: mvn clean package -DskipTests

      - name: config aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ID }}:role/github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: java-demo-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Checkout infra repo
        uses: actions/checkout@v7
        with:
          repository: 'BhupeshDahiya/prod-java-on-eks'
          token: ${{ secrets.GH_TOKEN }}
          path: infra

      - name: Update image tag in manifest
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/java-demo-app:${{ github.sha }}
        run: |
          sed -i "s|image:.*java-demo-app.*|image: $IMAGE|" infra/gitops/manifests/java_demo_app/deployment.yaml

      - name: Commit and push
        run: |
          cd infra
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/manifests/java_demo_app/deployment.yaml
          git commit -m "ci: update java-demo-app image to ${{ github.sha }}"
          git push
