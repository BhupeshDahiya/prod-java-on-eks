apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/apps
    repoURL: https://github.com/BhupeshDahiya/prod-java-on-eks
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true