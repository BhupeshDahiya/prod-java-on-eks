apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts/
    chart: loki
    targetRevision: 18.11.0
    helm:
      values: |
        loki:
          storage:
            type: s3
            bucketNames:
              chunks: backend-buck-tf
              ruler: backend-buck-tf
            s3:
              region: us-east-1
              s3ForcePathStyle: true
              insecure: false
          schemaConfig:
            configs:
              - from: "2026-05-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          commonConfig:
            replication_factor: 1
          monitoring:
            alerts:
              enabled: true
          serviceAccount:
            create: true
            name: loki-sa
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
