apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-ingress-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: ingress-nginx # deployed in nginx namespace so that alb can reach nginx
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/BhupeshDahiya/prod-java-on-eks
    path: gitops/manifests/alb_ingress_app/
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true