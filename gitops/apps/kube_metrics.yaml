apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.2
    helm:
      values: |
        prometheus:
          prometheusSpec:
            replicas: 1
            externalLabels:
              cluster: my-cluster
        kubeProxy:
          enabled: false
        grafana:
          service:
            type: ClusterIP
          ingress:
            enabled: true
            path: /grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true