apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: java-demo-app
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/BhupeshDahiya/prod-java-on-eks
    path: gitops/manifests/external_secrets/
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true