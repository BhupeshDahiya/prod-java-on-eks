apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: java-demo-app
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: db-secret
  data:
  - secretKey: username
    remoteRef:
      key: db_secrets
      property: username
  - secretKey: password
    remoteRef:
      key: db_secrets
      property: password
  - secretKey: host
    remoteRef:
      key: db_secrets
      property: host
  - secretKey: port
    remoteRef:
      key: db_secrets
      property: port
  - secretKey: dbname
    remoteRef:
      key: db_secrets
      property: dbname