apiVersion: v1
kind: ConfigMap
metadata:
  name: migrations
  namespace: java-demo-app
data:
  V1__create_persons_table.sql: |
    CREATE TABLE IF NOT EXISTS persons (
        id     BIGSERIAL PRIMARY KEY,
        name   VARCHAR(100) NOT NULL,
        dob    DATE         NOT NULL,
        email  VARCHAR(150) NOT NULL UNIQUE
    );
